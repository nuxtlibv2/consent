name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      # WHAT: Checks whether package.json's current version is already live on npm.
      # WHY: main gets a push on every merged PR, not just release ones - this makes the job a safe no-op for
      #      ordinary merges, and idempotent/self-healing if a previous publish attempt failed partway through
      #      (unlike gating on a git tag, which could exist even if the actual `npm publish` step never succeeded).
      # HOW: Asks the npm registry directly for `<name>@<version>`; a non-zero exit means that version is unpublished.
      - name: Check whether this version is already published
        id: check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.published == 'false'
        run: npm run prepack

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish

      # WHAT: Creates and pushes a `vX.Y.Z` git tag matching the version just published.
      # WHY: Tags aren't needed to trigger publishing anymore, but they're still useful as a permanent, immutable
      #      record of exactly which commit shipped as a given release (git history, GitHub Releases, bisecting).
      # HOW: Only runs after `npm publish` succeeds, so a tag never exists for a version that failed to publish.
      - name: Tag release
        if: steps.check.outputs.published == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"

