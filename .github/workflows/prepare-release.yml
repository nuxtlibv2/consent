name: Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reset release-prep branch from main
        run: git checkout -B release-prep main

      - name: Capture starting commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # WHAT: Bumps package.json's version, updates CHANGELOG.md, and commits both - but does NOT create a git tag.
      # WHY: The tag is created later, only after this bump actually gets merged to main and successfully
      #      published (see publish.yml), so a tag never exists for a version that isn't really on npm yet.
      # HOW: changelogen inspects conventional commits since the last release to pick the next semver version.
      - name: Bump version and update changelog
        run: npx changelogen@latest --release --no-tag

      - name: Check if a new release commit was created
        id: check
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ steps.before.outputs.sha }}" ]; then
            echo "No releasable changes found since the last release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push release-prep branch
        if: steps.check.outputs.changed == 'true'
        run: git push --force origin release-prep

      - name: Read new version
        if: steps.check.outputs.changed == 'true'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # WHAT: Opens a PR for the version bump, or lets the force-push above update an already-open one.
      # WHY: main is protected (PR required, no bypass actors), so even an automated version bump must go
      #      through the same required lint/test/build checks as any other change before it can be merged.
      # HOW: Uses the GitHub CLI (preinstalled on the runner) with the workflow's own token; only creates a
      #      new PR if one from `release-prep` doesn't already exist, otherwise the force-push above is enough.
      - name: Open or update release PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view release-prep --json number >/dev/null 2>&1; then
            echo "Release PR already exists, updated by the push above."
          else
            gh pr create \
              --base main \
              --head release-prep \
              --title "chore(release): v${{ steps.version.outputs.version }}" \
              --body "Automated release preparation. Merging this PR bumps the version and, once on main, publish.yml will publish v${{ steps.version.outputs.version }} to npm."
          fi
